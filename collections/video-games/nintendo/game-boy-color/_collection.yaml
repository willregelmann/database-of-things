name: Game Boy Color
date: "1998-10-21"
description: >-
  Nintendo's color-capable successor to the original Game Boy, released
  1998 (Japan/US). A separate platform from the original Game Boy — its
  own hardware, its own product-code prefix, and its own cartridge shape
  distinct from DMG carts, even for titles playable on both systems.
