id: 2b04e991-c1b5-401b-b324-d092745f71e1
type: collection
name: Legends
date: "1994-06-10"
description: >-
  Magic's third expansion set, released June 10, 1994. Introduced legendary
  creatures and the accompanying "legend rule" restricting a player to one copy
  of a given legend at a time, and was the first set to include two-part
  combined cards. At 310 cards, it was the largest Magic set released up to that
  point.
category: Trading Card Games
