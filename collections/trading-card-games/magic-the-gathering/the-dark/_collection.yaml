id: bd9f09f1-cdb6-42a9-a16f-11c14e82dfe0
type: collection
name: The Dark
date: "1994-08-08"
description: >-
  Magic's fourth expansion set, released August 8, 1994. A mood-based set
  exploring a darker, more sacrificial tone across all five colors rather than
  black alone, often cited as the first Magic set built around a unified
  artistic sensibility. At 119 cards, it was considerably smaller than the
  preceding Legends.
category: Trading Card Games
