id: ea664ec6-f18c-4582-844d-492f416d5ef0
type: collection
name: Arabian Nights
date: "1993-12-17"
description: >-
  Magic's first expansion set, released December 17, 1993, following the
  original Limited Edition/Unlimited card pool. Drew its card pool from Middle
  Eastern and North African folklore, including genies, magic lamps, and desert
  settings. Sold only in booster packs with no accompanying starter decks, and
  the first Magic set to print more than one piece of art for some common cards.
category: Trading Card Games
