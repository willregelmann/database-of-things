id: 57903545-bc01-4964-8456-e8ba97d8f0b2
type: collection
name: Antiquities
date: "1994-03-04"
description: >-
  Magic's second expansion set, released March 4, 1994. Built around the
  Brothers' War backstory between the artificers Urza and Mishra, giving the set
  an artifact-heavy card pool. The first Magic set to give multiple pieces of
  art to nonbasic land cards, printing four distinct versions each of five
  utility lands.
category: Trading Card Games
