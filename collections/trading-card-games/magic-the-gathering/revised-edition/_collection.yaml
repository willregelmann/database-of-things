id: fbfaa1fe-ec7b-4ace-9bcc-819c283e30cc
type: collection
name: Revised Edition
date: "1994-04-11"
description: >-
  Magic's third core set, released April 11, 1994, following Limited Edition
  Beta and Unlimited Edition. A reprint-only 306-card release that adjusted a
  handful of cards from the earlier core sets, replaced the basic-land
  illustrations with new artwork, and refined rules wording and card templating
  ahead of wider international retail distribution.
category: Trading Card Games
