id: 841f2add-2f72-4fd3-aac6-4b56a418cd54
type: collection
name: Fallen Empires
date: "1994-11-15"
description: >-
  Magic's fifth expansion set, released November 15, 1994. Depicted several
  declining factions across the game's setting, giving many common cards
  multiple pieces of alternate art to distinguish each faction. Wizards of the
  Coast printed it well beyond demand, and it is remembered in the hobby for the
  resulting secondary-market price crash.
category: Trading Card Games
