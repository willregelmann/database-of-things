id: f13dc028-964e-45f2-ab2d-b16973573262
name: Legend of Blue Eyes White Dragon
type: collection
description: >
  The first Yu-Gi-Oh! TCG set, released in North America on March 8, 2002 under
  Upper Deck Entertainment. Established the game's original English card pool
  and introduced Blue-Eyes White Dragon, Dark Magician and Exodia the Forbidden
  One. Issued as several distinct printings, each catalogued separately below;
  the non-English printings use different prefixes again (LDD for French,
  Italian and Spanish, LDB for Portuguese) and are out of scope here.
date: "2002-03-08"
