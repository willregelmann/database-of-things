name: Legend of Blue Eyes White Dragon
type: collection
description: >
  The first Yu-Gi-Oh! TCG set, first released in North America on March 8,
  2002 under Upper Deck Entertainment, and established the game's original
  English card pool, introducing Blue-Eyes White Dragon, Dark Magician and
  Exodia the Forbidden One. Issued as several distinct English printings
  (North American, European, Oceanic, Worldwide English) plus non-English
  ones out of scope here; only the Worldwide English printing (LOB-EN,
  2004-12-01) is currently catalogued, deliberately scoped down until further
  Yu-Gi-Oh curation resumes — see this directory's CLAUDE.md.
date: "2004-12-01"
total_cards: 126
