id: 71b0e145-0152-4fbc-956c-8b921e73d483
type: collection
name: Nintendo Black Star Promos
date: "2003"
ongoing: false
description: >
  The second Pokémon Trading Card Game promotional card line, distributed by
  Nintendo of America (and later Pokémon USA) from October 2003 through
  September 2006, succeeding the Wizards Black Star Promos after Wizards of the
  Coast lost the TCG license. Tied to the EX Series' Pokémon ex and Delta
  Species-era mechanics, and distributed through channels like Nintendo Power
  magazine, tournament prizes, DVD releases, and retail value packs. Spans 40
  cards, numbered 001 through 040.
