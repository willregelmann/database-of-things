id: 3f462d02-1de6-4fd6-98b6-11a030be89c2
name: Rebel Clash
type: collection
description: >
  The second main expansion of the Pokémon Trading Card Game's Sword & Shield
  series, released in English on May 1, 2020. It expanded on the VMAX mechanic
  introduced in the base Sword & Shield set, adding VMAX forms for the fully
  evolved forms of the Galar region's three starter Pokémon alongside Copperajah
  VMAX and Dragapult VMAX. The 192-card set is rounded out to 209 cards by a run
  of secret rares.
date: "2020-05-01"
total_cards: 192
