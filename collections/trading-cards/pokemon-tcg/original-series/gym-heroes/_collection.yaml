id: 0f28b9e3-fcae-43b2-add0-03242c823f90
name: Gym Heroes
type: collection
description: >
  The sixth Pokémon Trading Card Game expansion released in English, published
  by Wizards of the Coast on August 14, 2000. Spans 132 cards featuring Pokémon
  owned by six Kanto Gym Leaders — Brock, Misty, Lt. Surge, Erika, Sabrina, and
  Blaine — alongside a handful of Team Rocket agents infiltrating their ranks,
  and introduced the "Owner's Pokémon" mechanic of printing a Trainer's name and
  Gym Badge directly on a Pokémon card.
date: "2000-08-14"
total_cards: 132
