name: Boris the Bear
type: collection
date: "1986-07"
description: >
  Dark Horse's second published title, launched July 1986 alongside Dark Horse
  Presents. A satirical funny-animal book created by James Dean Smith and
  written with Mike Richardson and Randy Stradley, opening as a parody of the
  black-and-white comics glut of the mid-1980s.
