id: a2063b1e-2c7c-4ccf-a41a-be6f6c7d6d26
name: Ghost in the Shell
type: collection
date: "1995-03"
description: >
  Masamune Shirow's cyberpunk series about a cybernetic public-security officer,
  serialized in Japan in Kodansha's Young Magazine. This collection covers Dark
  Horse's English edition, begun as an eight-issue comic series in March 1995
  and collected that December. Kodansha Comics has published the series in
  English since 2009; that edition is filed under its own publisher and
  reunified by the Ghost in the Shell franchise tag.
