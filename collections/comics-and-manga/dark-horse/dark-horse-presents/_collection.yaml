id: adccf3d9-1d1e-4190-9739-d6d40a87da96
name: Dark Horse Presents
type: collection
date: "1986-07"
description: >
  Dark Horse's flagship anthology and its first published title, launched July
  1986. Ran as a showcase for short creator-owned work, and served as the
  first appearance for several properties that later became series of their
  own, including Sin City and the publisher's Aliens line.
