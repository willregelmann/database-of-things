id: b98b15a6-8c18-485b-a046-5ae4d146268b
name: Lone Wolf and Cub
type: collection
date: "2000"
description: >
  Kazuo Koike and Goseki Kojima's epic of a disgraced executioner travelling
  feudal Japan with his infant son. Dark Horse released the complete series in
  English across 28 digest volumes from 2000 to 2002, later reissued as deluxe
  hardcovers; an earlier partial English run came from a different publisher, so
  this collection covers the Dark Horse edition.
