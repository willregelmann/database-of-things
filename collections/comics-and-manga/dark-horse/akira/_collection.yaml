id: 41371436-1e50-4068-aa57-d795bb715b84
name: Akira
type: collection
date: "2000-12"
description: >
  Katsuhiro Otomo's post-apocalyptic epic, serialized in Japan in Kodansha's
  Young Magazine. This collection covers Dark Horse's English edition — six
  oversized black-and-white volumes released from December 2000, restoring the
  original monochrome art. Akira has had three English publishers; Epic Comics
  issued a colorized edition from 1988 and Kodansha Comics has published it
  since 2009, each a separate edition filed under its own publisher and
  reunified by the Akira franchise tag.
