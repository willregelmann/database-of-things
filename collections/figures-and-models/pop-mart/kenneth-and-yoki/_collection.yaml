name: Kenneth & Yoki
date: "2019-05-21"
description: >-
  Hong Kong artist Yoyo Yeung's IP for POP MART, covering two characters sold
  across separate blind-box series — Kenneth, a fox, and Yoki, a bat. POP MART's
  IP/Artist Zone lists the pair as a single artist-level entry rather than two
  IPs, though individual series are marketed under whichever character they
  feature.
