type: collection
name: HG (High Grade)
date: "1990"
description: >-
  High Grade is Bandai's most prolific Gunpla tier, molded at 1/144 scale with
  simpler engineering than the higher grades. Introduced in 1990, it has since
  split into many timeline-specific numbering sub-lines, such as HGUC and HGIBO,
  each numbered independently.
