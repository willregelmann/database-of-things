type: collection
name: HGUC (High Grade Universal Century)
date: "1999-05"
description: >-
  High Grade Universal Century (HGUC) is Bandai's original and largest HG
  sub-line, covering mobile suits from the Universal Century timeline at
  1/144 scale. Launched in 1999 to mark Gundam's 20th anniversary, it has
  its own continuous numbering separate from every other HG sub-line.
