name: HGBC (High Grade Build Custom)
date: "2013-11"
description: >-
  High Grade Build Custom (HGBC) is a High Grade prefix at 1/144 scale for
  add-on weapon and accessory sets used to customize other HG kits,
  tied to Gunpla Battle-themed media (Build Fighters, Build Divers), with
  its own numbering separate from every other HG sub-line.
