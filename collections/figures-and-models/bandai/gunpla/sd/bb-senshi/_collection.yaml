id: e1ccfe7f-2316-4127-a19c-1d375a2b7425
type: collection
name: BB Senshi
date: "1987-05"
description: >-
  BB Senshi is Bandai's original and longest-running SD Gundam kit line,
  launched in 1987 with its own continuous numbering that has grown past
  400 releases. It covers both Super Deformed versions of mobile suits
  from across the Gundam franchise and original SD-only characters,
  including the Musha/Sengokuden warrior-themed sub-series.
