name: SD (Super Deformed)
date: "1987"
description: >-
  Super Deformed kits reimagine Gundam mobile suits in a chibi, non-scale style
  that favors character over scale accuracy. The tier dates back to 1987's BB
  Senshi kits and has since split into several independently numbered sub-brands
  rather than one continuous line.
