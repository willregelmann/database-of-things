id: 223ea4d6-c410-473b-9316-939a419b9c39
name: Squish-A-Longs
type: collection
description: >
  Jazwares' miniature Squishmallows sub-brand — 1" squeezable figures called
  Mini-Squish, sold in 8-, 14- and 25-piece packs with clip-on rings,
  accessories and a collector's guide. Made of squeezable plastic rather than
  plush, and released in its own numbered series separate from the main
  Squishmallows Collector Number sequence.
